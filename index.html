<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>همیار رساله دکتری</title>
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="همیار رساله">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#1f5f8b;--ac2:#e8f1f8;--bd:#e2ded4;--ok:#2e8b57;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e8eaf0;--mu:#97a0b3;--ac:#6db3e0;--ac2:#22303d;--bd:#2c3340;--ok:#4cc38a;--bad:#ef7b6e}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8eaf0;--mu:#97a0b3;--ac:#6db3e0;--ac2:#22303d;--bd:#2c3340;--ok:#4cc38a;--bad:#ef7b6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.8;font-size:15px}
header{padding:12px 14px 6px;max-width:900px;margin:auto}
h1{font-size:18px;margin:0 0 8px}
input,textarea,select,button{font:inherit;color:var(--tx)}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
textarea{min-height:80px;resize:vertical}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 14px;max-width:900px;margin:auto}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);padding:5px 12px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:auto;padding:8px 14px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:15px}
.l{font-size:12px;color:var(--mu)}
.btn{border:1px solid var(--ac);background:var(--ac);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer}
.btn.g{background:transparent;color:var(--ac)}
.btn.d{background:transparent;color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:12px;padding:0 9px;font-size:12px;cursor:pointer;margin-left:4px}
.bar{height:10px;background:var(--ac2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{text-align:center}.stat b{font-size:22px;display:block;color:var(--ac)}
.wk{display:flex;gap:6px;align-items:flex-end;height:90px}.wk div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.wk i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.f label{display:block;margin-top:8px;font-size:13px;color:var(--mu)}
.over{color:var(--bad)}.done{text-decoration:line-through;color:var(--mu)}
#toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:6px 16px;border-radius:20px;display:none;z-index:9}
details summary{cursor:pointer;color:var(--ac)}pre{white-space:pre-wrap;margin:6px 0 0;font:inherit;max-height:240px;overflow:auto}
.ed{min-height:300px;line-height:2}
blockquote{margin:8px 0;padding:2px 10px;border-right:3px solid var(--ac)}.sm{padding:2px 8px;font-size:13px}
.tl{position:absolute;inset:0;overflow:hidden;line-height:1}.tl span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;-webkit-user-select:text;user-select:text}.tl span::selection{background:#4a90e266}
.mt th,.mt td{border:1px solid var(--bd);font-size:13px}
</style>
</head>
<body>
<header><input id="ttl" placeholder="📚 نام رساله را اینجا بنویسید…" style="font-size:18px;font-weight:700;margin-bottom:8px"><input id="q" placeholder="جستجو در همه‌چیز (منابع، یادداشت‌ها، پیش‌نویس‌ها…)"></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="rd" style="display:none;position:fixed;inset:0;z-index:20;background:var(--bg);flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"><div class="row" style="padding:8px 12px;border-bottom:1px solid var(--bd);flex-wrap:nowrap"><button class="btn g" id="rdx">✕ بستن</button><b id="rdt" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></b><span id="rdp" class="l"></span></div><div class="row" id="rdbar" style="padding:6px 12px;border-bottom:1px solid var(--bd)"></div><div id="rdb" style="flex:1;overflow:auto;padding:12px;line-height:2"></div><div id="hb" class="row" style="display:none;position:absolute;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:8px;z-index:25;justify-content:center"><button class="btn" data-h="q">➕ نقل‌قول</button><button class="btn g" data-h="n">📝 یادداشت</button><span class="l" id="hbp"></span></div></div>
<div id="lb" style="display:none;position:fixed;inset:0;z-index:30;background:#000d;align-items:center;justify-content:center" onclick="this.style.display='none'"><img id="lbi" style="max-width:100%;max-height:100%"></div>
<div id="pk" style="display:none;position:fixed;inset:0;z-index:35;background:var(--bg);flex-direction:column;padding-top:env(safe-area-inset-top,0px)"><div class="row" style="padding:8px 12px"><input id="pks" placeholder="جستجو…" style="flex:1"><button class="btn g" id="pkx">✕</button></div><div id="pkl" style="flex:1;overflow:auto;padding:8px 12px"></div></div>
<div id="toast"></div>
<script>
const K='thesis_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString('fa-IR-u-ca-persian'):'';
const fa=n=>Number(n).toLocaleString('fa-IR');
const wc=t=>((t||'').trim().match(/\S+/g)||[]).length;
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({sources:[],notes:[],gaps:[],decisions:[],meetings:[],tasks:[],chapters:[],ms:{},log:{},quotes:[],codes:[]},S||{});
if(!S.chapters.length)S.chapters=['مقدمه','مرور ادبیات','روش‌شناسی','یافته‌ها','نتیجه‌گیری'].map(n=>({id:uid(),n,text:'',v:[]}));
const MS=['پروپوزال','مرور ادبیات','چارچوب نظری و روش‌شناسی','جمع‌آوری داده','تحلیل','نگارش','دفاع'];
S.zot=S.zot||{t:'users'};S.pos=S.pos||{};S.chapters.forEach(c=>{if(!c.lv)c.lv=1});S.meta=S.meta||{};S.cfg=Object.assign({style:'apa',refMode:'end',toc:true,cover:true,num:true,allRefs:false},S.cfg||{});
const SS=['شروع‌نشده','در حال مطالعه','خوانده‌شده'];const st=s=>s.status||SS[0];let sf='';let lim=30;
const defSt=()=>MS.map(n=>({id:uid(),n,p:0,d:''}));
if(!S.stages)S.stages=MS.map((n,i)=>({id:uid(),n,p:(S.ms[i]||{}).p||0,d:(S.ms[i]||{}).d||''}));
function save(){try{localStorage.setItem(K,JSON.stringify(S));snapSoon()}catch(e){toast('ذخیره ناموفق بود؛ شاید حافظه مرورگر پر است')}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
const TG=['tags','برچسب‌ها (با ویرگول جدا کنید)','t'];
const T={
sources:{n:'منابع',f:[['status','وضعیت مطالعه','s:'+SS.join(',')],['title','عنوان','t'],['author','نویسنده','t'],['year','سال','t'],['pub','ناشر / مجله','t'],['url','لینک','t'],['doi','DOI','doi'],['chapter','فصل مرتبط','ch'],['note','خلاصه / نکته','a'],TG]},
notes:{n:'یادداشت‌ها',f:[['text','یادداشت','a'],['imgs','تصویر / بریده (عکس)','img'],['src','منبع مرتبط','src'],['chapter','فصل','ch'],TG]},
meetings:{n:'جلسات',f:[['date','تاریخ جلسه','d'],['who','با چه کسی','t'],['text','خلاصه جلسه','a'],['actions','کارهای ناشی از جلسه (هر خط یک کار)','a'],TG]},
decisions:{n:'تصمیم‌ها',f:[['text','تصمیم','t'],['why','دلیل','a'],['date','تاریخ','d'],TG]},
gaps:{n:'ایده‌ها و شکاف‌ها',f:[['kind','نوع','s:شکاف پژوهشی,ایده,پرسش باز'],['text','متن','a'],TG]}
};
const TABS=[['dash','داشبورد'],['sources','منابع'],['matrix','ماتریس مرور'],['coding','کدگذاری'],['build','تدوین و خروجی'],['quotes','نقل‌قول‌ها'],['notes','یادداشت‌ها'],['draft','پیش‌نویس'],['plan','برنامه و کارها'],['meetings','جلسات'],['decisions','تصمیم‌ها'],['gaps','ایده‌ها'],['backup','پشتیبان']];
let tab='dash',ed=null,out='';
const chN=id=>(S.chapters.find(c=>c.id===id)||{}).n||'';
const srcT=id=>(S.sources.find(s=>s.id===id)||{}).title||'';
const cite=s=>[s.author,s.year&&'('+s.year+')'].filter(Boolean).join(' ')+'. '+[s.title,s.pub].filter(Boolean).join('. ')+'.';
const tagsOf=it=>(it.tags||'').split(/[,،]/).map(x=>x.trim()).filter(Boolean);
function field(f,v){const[k,l,t]=f;let i;
 if(t==='a')i=`<textarea name="${k}">${esc(v)}</textarea>`;
 else if(t==='img')i=`<input type="file" name="imgs" accept="image/*" multiple><div class="l">می‌توانید عکس را در کادر یادداشت Paste هم کنید.</div>${(v||[]).map(m=>`<label style="display:inline-block;margin-left:8px"><img data-im="${m}" style="height:60px;border-radius:6px;display:block"><input type="checkbox" name="rm" value="${m}" style="width:auto"> حذف</label>`).join('')}`;
 else if(t==='doi')i=`<div class="row"><input name="doi" value="${esc(v)}" dir="ltr" style="flex:1"><button type="button" class="btn g" data-a="doifill">پر کردن از DOI</button></div>`;
 else if(t==='d')i=`<input type="date" name="${k}" value="${esc(v||today())}">`;
 else if(t==='ch')i=`<select name="${k}"><option value="">—</option>${S.chapters.map(c=>`<option value="${c.id}" ${v===c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select>`;
 else if(t==='src')i=`<select name="${k}"><option value="">—</option>${S.sources.map(c=>`<option value="${c.id}" ${v===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select>`;
 else if(t[0]==='s')i=`<select name="${k}">${t.slice(2).split(',').map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
 else i=`<input name="${k}" value="${esc(v)}">`;
 return `<label>${l}</label>${i}`}
function disp(k,f,it){const v=it[f[0]];if(!v)return'';if(f[0]==='imgs')return v.length?`<div style="margin:6px 0">${v.map(m=>`<img data-im="${m}" data-a="zoomimg" style="height:90px;border-radius:8px;cursor:zoom-in;margin:0 0 6px 6px;background:var(--ac2);min-width:60px">`).join('')}</div>`:'';const t=f[2];
 if(f[0]==='tags')return tagsOf(it).map(x=>`<span class="tag" data-a="tag" data-v="${esc(x)}">#${esc(x)}</span>`).join('');
 const val=t==='ch'?chN(v):t==='src'?srcT(v):t==='d'?fd(v):v;
 if(f[0]==='url')return `<div class="l">${esc(f[1])}: <a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a></div>`;
 return `<div class="${f===T[k].f[0]?'':'l'}">${f===T[k].f[0]?'':esc(f[1])+': '}${esc(val)}</div>`}
function card(k,it){if(k==='quotes')return quoteCard(it);const F=T[k].f;let h=`<div class="card"><div class="row" style="justify-content:space-between"><h3>${k==='sources'?esc(it.title):k==='notes'||k==='gaps'?esc(it.text||(k==='notes'?'📷 یادداشت تصویری':'')):esc(it[F[0][0]==='date'?'text':F[0][0]]||it.text||'')}</h3><span class="l">${fd(new Date(it.created))}</span></div>`;
 if(k==='sources')h+=`<div class="l">${esc(cite(it))}</div>`;if(k==='sources'){const qn=S.quotes.filter(q=>q.src===it.id);if(qn.length)h+=`<div class="l">🏷 ${fa(qn.length)} بخش داده · ${fa(qn.filter(q=>(q.codes||[]).length).length)} کدگذاری‌شده</div>`}
 F.slice(k==='sources'||k==='notes'||k==='gaps'?1:1).forEach(f=>{if(!(k==='sources'&&['author','year','pub'].includes(f[0]))&&!(k==='notes'&&f[0]==='text')&&!(k==='gaps'&&f[0]==='text'))h+=disp(k,f,it)});
 if(k==='meetings'&&it.date)h=h.replace('<h3>','<h3>جلسه '+fd(it.date)+' — ');
 [['file',it.id,'فایل ۱'],['file2',it.id+'_2','فایل ۲']].forEach(([fk,pk,lb])=>{const f=it[fk];if(f)h+=`<div class="row"><button class="btn" data-a="open" data-id="${it.id}" data-s="${fk}">📖 ${lb}: ${esc(f.name.slice(0,28))}${S.pos[pk]?' · '+fa(Math.round((S.pos[pk].pr||0)*100))+'٪':''}</button></div>`});if(it.file)h+=`<details><summary>📎 ${esc(it.file.name)}</summary>${it.file.text?'<pre>'+esc(it.file.text.slice(0,3000))+'</pre>':'<div class="l">فقط مرجع فایل ذخیره شده (متن فقط برای txt و md ذخیره می‌شود)</div>'}</details>`;
 if(k==='quotes')h+=`<div class="l">${esc(inText(it))}</div><div class="row"><button class="btn g" data-a="cpq" data-id="${it.id}">کپی نقل‌قول + ارجاع</button><button class="btn g" data-a="qdraft" data-id="${it.id}">افزودن به پیش‌نویس</button></div>`;
 const rel=tagsOf(it).length?Object.keys(T).reduce((n,x)=>n+S[x].filter(o=>o!==it&&tagsOf(o).some(t=>tagsOf(it).includes(t))).length,0):0;
 if(rel)h+=`<div class="l">🔗 ${fa(rel)} مورد مرتبط با برچسب‌های مشترک</div>`;
 return h+`<div class="row" style="margin-top:6px">${k==='sources'?SS.filter(x=>x!==st(it)).map(x=>`<button class="btn g" data-a="mv" data-id="${it.id}" data-v="${x}">← ${x}</button>`).join(''):''}<button class="btn g" data-a="edit" data-k="${k}" data-id="${it.id}">ویرایش</button><button class="btn d" data-a="del" data-k="${k}" data-id="${it.id}">حذف</button></div></div>`}
function listView(k,q,tag){const cur=ed&&ed.k===k?S[k].find(x=>x.id===ed.id):null;
 let h=`<form class="card f" data-k="${k}"><b>${cur?'ویرایش':'افزودن'}</b>${T[k].f.map(f=>field(f,cur?cur[f[0]]:'')).join('')}${k==='sources'?'<label>فایل اول، مثلاً متن اصلی (txt/md/pdf/docx)</label><input type="file" name="file"><label>فایل دوم (مثلاً ترجمه)</label><input type="file" name="file2">':''}<div class="row" style="margin-top:10px"><button class="btn">ذخیره</button>${cur?'<button type="button" class="btn g" data-a="cancel">انصراف</button>':''}</div></form>`;
 if(k==='sources')h+=chips()+zotCard();if(k==='sources'&&S.sources.length)h+=`<button class="btn g" data-a="bib" style="margin-bottom:10px">📋 تولید فهرست منابع</button>${out&&tab==='sources'?`<textarea id="o" readonly>${esc(out)}</textarea>`:''}`;
 const items=S[k].filter(it=>(!tag||tagsOf(it).includes(tag))&&(k!=='sources'||!sf||st(it)===sf)).sort((a,b)=>b.created-a.created);
 return h+(items.slice(0,lim).map(i=>card(k,i)).join('')||'<div class="l">هنوز موردی ثبت نشده.</div>')+(items.length>lim?`<button class="btn g" data-a="more" style="width:100%;margin:10px 0">نمایش بیشتر (${fa(items.length-lim)} مورد دیگر)</button>`:'')}
function dash(){const tw=S.chapters.reduce((n,c)=>n+wc(c.text),0);const pr=S.stages.length?Math.round(S.stages.reduce((n,s)=>n+s.p,0)/S.stages.length):0;
 const ks=Object.keys(S.log).sort(),df={};let pv=0;ks.forEach(k=>{df[k]=Math.max(0,S.log[k]-pv);pv=S.log[k]});
 const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);const k=d.toISOString().slice(0,10);return[d.toLocaleDateString('fa-IR-u-ca-persian',{weekday:'short'}),df[k]||0]});const mx=Math.max(1,...days.map(d=>d[1]));
 const up=S.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1).slice(0,5);
 return `${bk()}<div class="card" data-a="tab" data-v="plan" style="cursor:pointer"><b>پیشرفت کلی رساله: ${fa(pr)}٪</b><div class="bar"><i style="width:${pr}%"></i></div></div>
 <div class="grid">${[['منابع',S.sources.length,'sources'],['یادداشت',S.notes.length,'notes'],['کلمه',tw,'draft'],['صفحه (تخمینی)',Math.ceil(tw/300),'draft']].map(([l,v,t])=>`<div class="card stat" data-a="tab" data-v="${t}" style="cursor:pointer"><b>${fa(v)}</b>${l}</div>`).join('')}</div>
 <div class="card" data-a="tab" data-v="draft" style="cursor:pointer"><b>کلمات نوشته‌شده در ۷ روز اخیر</b><div class="wk">${days.map(([l,v])=>`<div><span>${fa(v)}</span><i style="height:${v/mx*60}px"></i>${l}</div>`).join('')}</div></div>
 <div class="card" data-a="tab" data-v="plan" style="cursor:pointer"><b>کارهای پیش رو</b>${up.map(t=>`<div>• ${esc(t.title)} <span class="l ${t.due&&t.due<today()?'over':''}">${fd(t.due)}</span></div>`).join('')||'<div class="l">کار بازی نیست.</div>'}</div>`}
function draft(){const c=S.chapters.find(x=>x.id===S.cur)||S.chapters[0];S.cur=c.id;
 return `<div class="card"><div class="row"><select data-ch style="flex:1">${S.chapters.map(x=>`<option value="${x.id}" ${x===c?'selected':''}>${'· '.repeat((x.lv||1)-1)}${esc(x.n)} (${fa(wc(x.text))} کلمه)</option>`).join('')}</select><button class="btn g" data-a="addch">+ فصل</button><button class="btn g" data-a="rench">تغییر نام</button><button class="btn d" data-a="delch">حذف</button></div></div>
 <div class="card"><div class="row" style="margin-bottom:6px"><button class="btn g sm" data-a="ins" data-v="ref">＋ ارجاع</button><button class="btn g sm" data-a="ins" data-v="quote">＋ نقل‌قول</button><button class="btn g sm" data-a="ins" data-v="code">＋ شاخه‌ی کد</button><button class="btn g sm" data-a="ins" data-v="meta">＋ متن روش</button></div><textarea id="ed" class="ed" placeholder="پیش‌نویس این فصل…">${esc(c.text)}</textarea><div class="row" style="margin-top:8px"><span class="l" id="wcn">${fa(wc(c.text))} کلمه · حدود ${fa(Math.ceil(wc(c.text)/300))} صفحه</span><select id="xs" style="width:auto"><option value="one">این فصل</option><option value="all">همه‌ی فصل‌ها</option></select><button class="btn g" data-a="xw">Word</button><button class="btn g" data-a="xp">PDF</button><button class="btn" data-a="ver">ذخیره نسخه</button></div></div>

async function dk(pw,salt){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(t,pw){const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await dk(pw,s),new TextEncoder().encode(t)));return 'ENC:'+b64([...s,...iv,...c])}
async function dec(t,pw){const a=Uint8Array.from(atob(t.slice(4)),c=>c.charCodeAt(0));return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(16,28)},await dk(pw,a.slice(0,16)),a.slice(28)))}

  h+=`<div class="card f"><label>سبک ارجاع</label>${sel('style',[['apa','APA (نویسنده، سال)'],['chi','شیکاگو (نویسنده سال)'],['num','شماره‌ای [۱]']])}<label>محل فهرست منابع</label>${sel('refMode',[['end','پایان رساله'],['chapter','پایان هر فصل']])}<label>بخش خروجی</label><select data-bsc="1"><option value="all">کل رساله</option>${S.chapters.map(c=>`<option value="${c.id}" ${bsc===c.id?'selected':''}>${'· '.repeat(c.lv-1)}${esc(c.n)}</option>`).join('')}</select>${[['cover','صفحه‌ی عنوان'],['toc','فهرست مطالب (Word)'],['num','شماره‌گذاری خودکار فصل و بخش'],['allRefs','همه‌ی منابع در فهرست (حتی ارجاع‌نشده)']].map(([k,l])=>`<label style="color:var(--tx)"><input type="checkbox" style="width:auto" data-cfg="${k}" ${S.cfg[k]?'checked':''}> ${l}</label>`).join('')}</div>`;
  h+=`<div class="card" dir="auto">📊 ${fa(R.B.filter(b=>b[0]==='P').reduce((n,b)=>n+wc(b[1]),0))} کلمه · ${fa(R.cited.size)} منبع ارجاع‌شده${unc?` · <span class="over">${fa(unc)} منبع ارجاع‌نشده</span>`:''}${leaf?` · <span class="over">${fa(leaf)} بخش خالی</span>`:''}</div><div class="row" style="margin-bottom:8px"><button class="btn g" data-a="prev">${prevOn?'بستن پیش‌نمایش':'پیش‌نمایش'}</button><button class="btn" data-a="bw">Word</button><button class="btn g" data-a="bp">PDF</button></div>${prevOn?`<div class="card" dir="rtl" style="line-height:2">${bodyHtml(R.B)}</div>`:''}`}
 return h}
function insTok(t){const ed=$('#ed');if(!ed)return;const a=ed.selectionStart==null?ed.value.length:ed.selectionStart;ed.value=ed.value.slice(0,a)+t+ed.value.slice(a);ed.focus();ed.selectionStart=ed.selectionEnd=a+t.length;ed.dispatchEvent(new Event('input',{bubbles:true}))}
function pkOpen(t){pkT=t;pkQ='';$('#pk').style.display='flex';$('#pks').value='';pkList()}
function pkList(){const n=norm(pkQ);let it=[];if(pkT==='ref')it=S.sources.map(x=>[x.id,x.title+' — '+(x.author||'')+' '+(x.year||'')]);else if(pkT==='quote')it=S.quotes.map(q=>[q.id,q.text.slice(0,120)]);else it=S.codes.map(c=>[c.id,'['+LV[c.level]+'] '+c.name]);
 $('#pkl').innerHTML=it.filter(x=>norm(x[1]).includes(n)).slice(0,80).map(x=>`<button class="btn g" style="display:block;width:100%;text-align:right;margin-bottom:6px" dir="auto" data-pk="${x[0]}">${esc(x[1])}</button>`).join('')||'<div class="l">موردی نیست</div>'}
$('#pkx').onclick=()=>{$('#pk').style.display='none'};$('#pks').oninput=e=>{pkQ=e.target.value;pkList()};
$('#pkl').onclick=e=>{const b=e.target.closest('[data-pk]');if(!b)return;const id=b.dataset.pk;let t='';if(pkT==='ref'){const x=S.sources.find(y=>y.id===id),pg=prompt('شماره صفحه (اختیاری):','');t='[[ref:'+id+'|'+(pg||'').replace(/[\]|]/g,'')+'|'+autOf(x).a1.replace(/[\]|]/g,' ')+' '+(x.year||'')+']]'}else if(pkT==='quote'){const q=S.quotes.find(y=>y.id===id);t='\n[[quote:'+id+'|'+q.text.slice(0,30).replace(/[\]|]/g,' ')+'…]]\n'}else{const c=S.codes.find(y=>y.id===id);t='\n[[code:'+id+'|'+c.name.replace(/[\]|]/g,' ')+']]\n'}$('#pk').style.display='none';insTok(t)};
let cs='1',mlv=3;const cfv={src:'',unc:''};
const LV=['','کد اولیه','کد ثانویه','مقوله','مضمون'],GD={1:'هر بخش داده را بخوانید و با برچسب‌های کوتاه و توصیفی (ترجیحاً نزدیک به زبان خود متن) کدگذاری کنید. یک بخش می‌تواند چند کد داشته باشد.',2:'کدهای اولیه‌ی مشابه یا هم‌معنا را زیر یک کد ثانویه (متمرکز) جمع کنید. کدهای تکراری را ادغام کنید.',3:'کدهای ثانویه را در مقوله‌های مفهومی‌تر قرار دهید و برای هر مقوله تعریف و ویژگی‌ها را در یادداشت بنویسید.',4:'مقوله‌ها را به مضمون یا مقوله‌ی هسته وصل کنید و رابطه‌ی بین مقوله‌ها را در یادداشت تحلیلی توضیح دهید.'};
const cName=id=>(S.codes.find(c=>c.id===id)||{}).name||'',kidsOf=id=>S.codes.filter(c=>c.parent===id),nSrc=a=>new Set(a.map(q=>q.src)).size;
const segsOf=c=>c.level===1?S.quotes.filter(q=>(q.codes||[]).includes(c.id)):[...new Set(kidsOf(c.id).flatMap(segsOf))];
function addCodeTo(qid,name){name=(name||'').trim();if(!name)return;const q=S.quotes.find(x=>x.id===qid);let c=S.codes.find(x=>x.level===1&&norm(x.name)===norm(name));if(!c){c={id:uid(),name,level:1,parent:null,memo:'',created:Date.now()};S.codes.push(c)}q.codes=q.codes||[];if(!q.codes.includes(c.id))q.codes.push(c.id);save();render()}
function codebook(){const ln=(c,d)=>{const sg=segsOf(c),ind='  '.repeat(d);let t=ind+'- **'+LV[c.level]+': '+c.name+'** ('+sg.length+' بخش، '+nSrc(sg)+' منبع)'+(c.memo?' — '+c.memo.replace(/\n/g,' '):'')+'\n';t+=kidsOf(c.id).map(k=>ln(k,d+1)).join('');if(c.level===1)t+=sg.map(q=>ind+'  - «'+q.text.replace(/\n/g,' ')+'» '+inText(q)+'\n').join('');return t};return '# کدبوک\n\n'+S.codes.filter(c=>!c.parent).sort((a,b)=>b.level-a.level).map(c=>ln(c,0)).join('')}
function coding(){const nav=[['1','۱ کد اولیه'],['2','۲ کد ثانویه'],['3','۳ مقوله‌ها'],['4','۴ مضمون‌ها'],['map','نقشه'],['mx','ماتریس'],['book','کدبوک']],nl=l=>S.codes.filter(c=>c.level===l).length,cod=S.quotes.filter(q=>(q.codes||[]).length).length,orph=S.codes.filter(c=>c.level<4&&!c.parent).length;
 let h=`<div class="row" style="margin-bottom:8px">${nav.map(([k,n])=>`<button class="btn ${cs===k?'':'g'}" data-a="cs" data-v="${k}">${n}</button>`).join('')}</div><div class="card l" dir="auto">بخش کدگذاری‌شده: ${fa(cod)} از ${fa(S.quotes.length)} · کد اولیه ${fa(nl(1))} · ثانویه ${fa(nl(2))} · مقوله ${fa(nl(3))} · مضمون ${fa(nl(4))}${orph?` · <span class="over">بدون والد: ${fa(orph)}</span>`:''}</div>`;
 if(GD[cs])h+=`<div class="l" dir="auto" style="margin-bottom:8px">💡 ${GD[cs]}</div>`;
 if(cs==='1'){const qs=S.quotes.filter(q=>(!cfv.src||q.src===cfv.src)&&(cfv.unc!=='1'||!(q.codes||[]).length));
  h+=`<datalist id="dl1">${S.codes.filter(c=>c.level===1).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div class="card"><div class="row"><select data-cfs="src" style="flex:1"><option value="">همه‌ی منابع</option>${S.sources.map(x=>`<option value="${x.id}" ${cfv.src===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><select data-cfs="unc" style="flex:1"><option value="">همه</option><option value="1" ${cfv.unc==='1'?'selected':''}>فقط بدون کد</option></select></div></div>`;
  h+=`<details class="card f"><summary>+ افزودن بخش داده</summary><form data-k="quotes">${field(['text','متن بخش','a'],'')}${field(['src','منبع','src'],cfv.src)}${field(['page','صفحه','t'],'')}<div style="margin-top:10px"><button class="btn">ذخیره</button></div></form></details>`;
  h+=qs.map(q=>{const x=S.sources.find(y=>y.id===q.src);return `<div class="card"><div dir="auto" style="border-right:3px solid var(--ac);padding:2px 10px;white-space:pre-wrap">${esc(q.text.slice(0,400))}${q.text.length>400?'…':''}</div><div class="l" dir="auto" style="margin:4px 0">${x?'📖 '+esc(x.title):''}${q.page?' · ص '+q.page:''}</div><div>${(q.codes||[]).map(id=>`<span class="tag" data-a="uncode" data-q="${q.id}" data-c="${id}">${esc(cName(id))} ✕</span>`).join('')}</div><input list="dl1" data-ci="${q.id}" placeholder="افزودن کد اولیه… (بنویسید و تأیید کنید)" style="margin-top:6px"></div>`}).join('')||'<div class="l">بخشی نیست. از خواندن فایل‌ها نقل‌قول بگیرید یا بالا اضافه کنید.</div>'}
 else if(cs==='2'||cs==='3'||cs==='4'){const l=+cs,cont=S.codes.filter(c=>c.level===l),ch=S.codes.filter(c=>c.level===l-1);
  h+=`<div class="card f"><b>${LV[l]} جدید</b><div class="row"><input placeholder="نام ${LV[l]}" style="flex:1"><button class="btn" data-a="newcode" data-l="${l}">افزودن</button></div></div>`;
  h+=cont.map(c=>{const sg=segsOf(c),kk=kidsOf(c.id);return `<div class="card"><div class="row" style="justify-content:space-between"><b dir="auto">${esc(c.name)}</b><span class="l">${fa(kk.length)} زیرکد · ${fa(sg.length)} بخش · ${fa(nSrc(sg))} منبع</span></div><div>${kk.map(k=>`<span class="tag" style="cursor:default">${esc(k.name)}</span>`).join('')}</div><textarea data-cm="${c.id}" placeholder="تعریف / یادداشت تحلیلی…" style="min-height:60px;margin-top:6px">${esc(c.memo)}</textarea><div class="row" style="margin-top:6px"><button class="btn g" data-a="rncode" data-id="${c.id}">تغییر نام</button><button class="btn g" data-a="mgcode" data-id="${c.id}">ادغام</button><button class="btn d" data-a="delcode" data-id="${c.id}">حذف</button></div></div>`}).join('')||`<div class="l">هنوز ${LV[l]}ی نساخته‌اید.</div>`;
  h+=`<div class="card"><b>${LV[l-1]} ← ${LV[l]} (تعیین والد)</b>${ch.map(c=>{const sg=segsOf(c);return `<div style="border-top:1px solid var(--bd);padding:6px 0"><div dir="auto">${esc(c.name)} <span class="l">${fa(sg.length)} بخش · ${fa(nSrc(sg))} منبع</span></div><select data-par="${c.id}" ${c.parent?'':'style="border-color:var(--bad)"'}><option value="">— بدون ${LV[l]} —</option>${cont.map(p=>`<option value="${p.id}" ${c.parent===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="row" style="margin-top:4px"><button class="btn g" data-a="rncode" data-id="${c.id}">نام</button><button class="btn g" data-a="mgcode" data-id="${c.id}">ادغام</button><button class="btn d" data-a="delcode" data-id="${c.id}">حذف</button></div></div>`}).join('')||`<div class="l">ابتدا ${LV[l-1]} بسازید.</div>`}</div>`}
 else if(cs==='map'){const node=c=>{const sg=segsOf(c),kk=kidsOf(c.id);return `<details style="margin:4px 8px 4px 0;border-right:2px solid var(--bd);padding-right:8px"><summary dir="auto"><b>${LV[c.level]}</b>: ${esc(c.name)} <span class="l">${fa(sg.length)} بخش · ${fa(nSrc(sg))} منبع</span>${c.level<4&&!c.parent?' <span class="over">(بدون والد)</span>':''}</summary>${c.memo?`<div class="l" dir="auto">${esc(c.memo)}</div>`:''}${kk.map(node).join('')}${c.level===1?sg.map(q=>`<div class="l" dir="auto" style="margin:4px 0">«${esc(q.text.slice(0,160))}» — ${esc(inText(q))}</div>`).join(''):''}</details>`};
  h+=`<div class="card">${S.codes.filter(c=>!c.parent).sort((a,b)=>b.level-a.level).map(node).join('')||'<div class="l">هنوز کدی نیست.</div>'}</div>`}
 else if(cs==='mx'){const cl=S.codes.filter(c=>c.level===mlv),rows=S.sources.filter(x=>S.quotes.some(q=>q.src===x.id&&(q.codes||[]).length)),sc=cl.map(segsOf);
  h+=`<div class="card f"><label>سطح ستون‌ها</label><select data-ml="1">${[1,2,3,4].map(l=>`<option value="${l}" ${mlv===l?'selected':''}>${LV[l]}</option>`).join('')}</select></div>`;
  h+=cl.length&&rows.length?`<div style="overflow-x:auto"><table class="mt" style="border-collapse:collapse;min-width:100%"><tr><th>منبع</th>${cl.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr>${rows.map(x=>`<tr><td style="padding:4px;min-width:120px">${esc(x.title)}</td>${sc.map(a=>{const n=a.filter(q=>q.src===x.id).length;return `<td style="text-align:center;${n?'background:var(--ac2);font-weight:700':''}">${n?fa(n):''}</td>`}).join('')}</tr>`).join('')}<tr><td><b>جمع</b></td>${sc.map(a=>`<td style="text-align:center"><b>${fa(a.length)}</b></td>`).join('')}</tr></table></div>`:'<div class="l">برای ماتریس، ابتدا بخش‌ها را کدگذاری کنید و در این سطح کد بسازید.</div>'}
 else if(cs==='book'){h+=`<div class="row"><button class="btn" data-a="book">تولید کدبوک (Markdown)</button></div>${out&&tab==='coding'?`<textarea id="o" readonly style="min-height:260px;margin-top:8px">${esc(out)}</textarea><div class="l">متن را انتخاب و کپی کنید.</div>`:''}`}
 return h}
